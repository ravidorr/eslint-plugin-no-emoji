name: Publish

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    name: Publish npm package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Require approving review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/check-pull-request-approval.mjs

      - name: Validate release metadata
        env:
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          BASE_REF="$(git rev-parse "${MERGE_COMMIT_SHA}^")"
          node scripts/validate-release-metadata.mjs \
            --base-ref "$BASE_REF" \
            --labels "$RELEASE_LABELS"

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: |
          npm run lint
          npm run test:coverage
          npm run test:pull-request-approval
          npm run test:security-policy
          npm run test:release-metadata

      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "eslint-plugin-no-emoji@${VERSION}" version >/dev/null 2>&1; then
            echo "eslint-plugin-no-emoji@${VERSION} is already published; skipping."
            exit 0
          fi
          npm publish --provenance --access public
